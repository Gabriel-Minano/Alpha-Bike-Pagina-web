<div class="filters" role="group" aria-label="Filtrar bicicletas por categoría">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="chip"
      [class.is-active]="option.value === active()"
      [attr.aria-pressed]="option.value === active()"
      (click)="selected.emit(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
